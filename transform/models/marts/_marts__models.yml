models:
  - name: dim_zones
    description: "Gold. Grain: one row per TLC taxi zone."
    config:
      contract: {enforced: true}
    constraints:
      - type: primary_key
        columns: [zone_id]
    columns:
      - name: zone_id
        data_type: integer
        constraints: [{type: not_null}]
        data_tests: [unique, not_null]
      - name: borough
        data_type: text
      - name: zone_name
        data_type: text
      - name: service_zone
        data_type: text
      - name: is_airport
        data_type: boolean
        constraints: [{type: not_null}]

  - name: fct_trips
    description: "Gold. Grain: one row per valid completed trip (rejected trips live in silver quarantine)."
    config:
      contract: {enforced: true}
    constraints:
      - type: primary_key
        columns: [trip_id]
    columns:
      - name: trip_id
        description: Deterministic surrogate key over the trip's natural attributes.
        data_type: text
        constraints: [{type: not_null}]
        data_tests: [unique, not_null]
      - name: vendor_id
        data_type: integer
      - name: pickup_at
        description: Pickup timestamp, New York local time.
        data_type: timestamp
        constraints: [{type: not_null}]
      - name: dropoff_at
        data_type: timestamp
        constraints: [{type: not_null}]
      - name: pickup_date
        data_type: date
        constraints: [{type: not_null}]
      - name: pickup_hour
        data_type: integer
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 23}
      - name: pickup_zone_id
        data_type: integer
        data_tests:
          - relationships:
              arguments: {to: ref('dim_zones'), field: zone_id}
      - name: dropoff_zone_id
        data_type: integer
        data_tests:
          - relationships:
              arguments: {to: ref('dim_zones'), field: zone_id}
      - name: pickup_borough
        data_type: text
      - name: dropoff_borough
        data_type: text
      - name: passenger_count
        data_type: integer
      - name: trip_distance_mi
        data_type: decimal(10,2)
      - name: trip_duration_min
        data_type: decimal(10,2)
      - name: fare_amount
        data_type: decimal(12,2)
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: tip_amount
        data_type: decimal(12,2)
      - name: tolls_amount
        data_type: decimal(12,2)
      - name: total_amount
        data_type: decimal(12,2)
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: payment_type_code
        data_type: integer
      - name: payment_method
        data_type: text
        data_tests:
          - accepted_values:
              arguments:
                values: [flex_fare, card, cash, no_charge, dispute, voided, unknown]
      - name: trip_kind
        data_type: text
        data_tests:
          - accepted_values:
              arguments:
                values: [street_hail, dispatch, unknown]
      - name: is_airport_trip
        data_type: boolean
        constraints: [{type: not_null}]
      - name: card_tip_rate
        description: tip_amount / fare_amount for card payments, null otherwise.
        data_type: decimal(8,4)

  - name: mart_daily_borough_kpis
    description: "Gold. Grain: one row per pickup date and pickup borough. Powers the operations KPI dashboard."
    config:
      contract: {enforced: true}
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [pickup_date, pickup_borough]
    columns:
      - name: pickup_date
        data_type: date
        constraints: [{type: not_null}]
      - name: pickup_borough
        data_type: text
      - name: trips
        data_type: bigint
        constraints: [{type: not_null}]
      - name: gross_revenue
        description: Sum of total_amount (fares, surcharges, taxes, tips, tolls).
        data_type: decimal(14,2)
      - name: fare_revenue
        data_type: decimal(14,2)
      - name: tip_revenue
        data_type: decimal(14,2)
      - name: avg_fare
        data_type: decimal(10,2)
      - name: avg_trip_distance_mi
        data_type: decimal(10,2)
      - name: avg_trip_duration_min
        data_type: decimal(10,2)
      - name: avg_card_tip_rate
        data_type: decimal(8,4)
      - name: airport_trip_share
        data_type: decimal(8,4)
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1}

  - name: mart_zone_hourly_demand
    description: "Gold. Grain: one row per pickup zone, day type and hour of day. Powers driver supply planning."
    config:
      contract: {enforced: true}
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [pickup_zone_id, day_type, pickup_hour]
    columns:
      - name: pickup_zone_id
        data_type: integer
        constraints: [{type: not_null}]
      - name: pickup_zone_name
        data_type: text
      - name: pickup_borough
        data_type: text
      - name: day_type
        data_type: text
        data_tests:
          - accepted_values:
              arguments: {values: [weekday, weekend]}
      - name: pickup_hour
        data_type: integer
      - name: trips
        data_type: bigint
      - name: active_days
        data_type: bigint
      - name: avg_trips_per_active_day
        data_type: decimal(10,2)
      - name: avg_fare
        data_type: decimal(10,2)

unit_tests:
  - name: ut_fct_trips_labels_and_card_tip_rate
    description: Payment and trip labels map correctly and tip rate is defined for card trips only.
    model: fct_trips
    given:
      - input: ref('int_trips__cleaned')
        rows:
          - {trip_id: t1, pickup_at: "2024-01-05 07:15:00", dropoff_at: "2024-01-05 07:35:00", pickup_zone_id: 132, dropoff_zone_id: 74, fare_amount: 40.00, tip_amount: 10.00, total_amount: 55.00, payment_type_code: 1, trip_type_code: 1}
          - {trip_id: t2, pickup_at: "2024-01-05 18:00:00", dropoff_at: "2024-01-05 18:10:00", pickup_zone_id: 74, dropoff_zone_id: 75, fare_amount: 10.00, tip_amount: 0.00, total_amount: 11.00, payment_type_code: 2, trip_type_code: 2}
      - input: ref('dim_zones')
        rows:
          - {zone_id: 74, borough: Manhattan, is_airport: false}
          - {zone_id: 75, borough: Manhattan, is_airport: false}
          - {zone_id: 132, borough: Queens, is_airport: true}
    expect:
      rows:
        - {trip_id: t1, pickup_hour: 7, pickup_borough: Queens, payment_method: card, trip_kind: street_hail, is_airport_trip: true, card_tip_rate: "0.2500"}
        - {trip_id: t2, pickup_hour: 18, pickup_borough: Manhattan, payment_method: cash, trip_kind: dispatch, is_airport_trip: false, card_tip_rate: null}

  - name: ut_daily_borough_kpis_aggregates_per_day_and_borough
    model: mart_daily_borough_kpis
    given:
      - input: ref('fct_trips')
        rows:
          - {trip_id: a, pickup_date: "2024-01-05", pickup_borough: Queens, total_amount: 55.00, fare_amount: 40.00, tip_amount: 10.00, card_tip_rate: 0.2500, is_airport_trip: true}
          - {trip_id: b, pickup_date: "2024-01-05", pickup_borough: Queens, total_amount: 15.00, fare_amount: 10.00, tip_amount: 0.00, card_tip_rate: null, is_airport_trip: false}
          - {trip_id: c, pickup_date: "2024-01-06", pickup_borough: Queens, total_amount: 20.00, fare_amount: 20.00, tip_amount: 0.00, card_tip_rate: 0.0000, is_airport_trip: false}
    expect:
      rows:
        - {pickup_date: "2024-01-05", pickup_borough: Queens, trips: 2, gross_revenue: "70.00", fare_revenue: "50.00", avg_fare: "25.00", avg_card_tip_rate: "0.2500", airport_trip_share: "0.5000"}
        - {pickup_date: "2024-01-06", pickup_borough: Queens, trips: 1, gross_revenue: "20.00", fare_revenue: "20.00", avg_fare: "20.00", avg_card_tip_rate: "0.0000", airport_trip_share: "0.0000"}
