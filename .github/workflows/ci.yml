name: ci

# Everything here runs on GitHub-hosted runners with no cloud credentials:
# DuckDB for the fast path, a PostgreSQL service container for Write-Audit-Publish,
# slim CI and per-PR schemas. Postgres passwords below are throwaway CI values for
# a container that only lives for the duration of the job.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DBT_PROFILES_DIR: ${{ github.workspace }}/transform
  LAKEHOUSE_DUCKDB_PATH: ${{ github.workspace }}/.lake/warehouse.duckdb
  DO_NOT_TRACK: "1"
  DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: lint (ruff, sqlfluff, yamllint, actionlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lakehouse

      - name: ruff
        run: |
          uv run --frozen ruff check --output-format=github .
          uv run --frozen ruff format --check .

      - name: sqlfluff (dbt templater)
        working-directory: transform
        run: |
          mkdir -p ../.lake  # the dbt templater opens the (empty) DuckDB file
          uv run --frozen sqlfluff lint models tests --format github-annotation-native

      - name: yamllint
        run: uv run --frozen yamllint --strict .

      - name: actionlint (checksum-verified binary)
        run: |
          curl -sSfL -o actionlint.tgz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tgz" | sha256sum --check --strict
          tar -xzf actionlint.tgz actionlint
          ./actionlint -color

  python-tests:
    name: pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lakehouse
      - name: dbt parse (manifest for the Dagster definition tests)
        working-directory: transform
        run: uv run --frozen dbt parse
      - name: pytest
        run: uv run --frozen pytest -v --junitxml=pytest-results.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pytest-results
          path: pytest-results.xml
          retention-days: 14

  duckdb-pipeline:
    name: pipeline on DuckDB (dlt, contracts, dbt, Dagster)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lakehouse

      - name: Ingestion data contracts (ODCS via datacontract-cli)
        run: |
          uv run --frozen datacontract test --server fixture contracts/tlc_green_trips.odcs.yaml
          uv run --frozen datacontract test --server fixture contracts/tlc_taxi_zones.odcs.yaml

      - name: dlt - land fixture and load raw_tlc
        run: uv run --frozen lakehouse ingest

      - name: dbt source freshness
        working-directory: transform
        run: uv run --frozen dbt source freshness

      - name: dbt build (unit tests, enforced contracts, data tests)
        run: uv run --frozen lakehouse build

      - name: Dagster - validate definitions
        run: uv run --frozen dagster definitions validate -m lakehouse.orchestration.definitions

      - name: Dagster - materialize every asset and run every asset check in-process
        run: uv run --frozen lakehouse run

      - name: Job summary
        if: always()
        run: |
          {
            echo "### DuckDB pipeline"
            echo ""
            echo '```'
            uv run --frozen python -m lakehouse.dbt_runner target/dagster
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  wap-postgres:
    name: Write-Audit-Publish on PostgreSQL (incl. negative test)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.14-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: lakehouse
          POSTGRES_PASSWORD: ci-throwaway-password # not a secret: ephemeral CI container
          POSTGRES_DB: lakehouse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lakehouse -d lakehouse"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      LAKEHOUSE_TARGET: postgres
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: lakehouse
      PGPASSWORD: ci-throwaway-password
      PGDATABASE: lakehouse
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lakehouse

      - name: "1. Ingest a good delivery"
        run: uv run --frozen lakehouse ingest

      - name: "2. WAP: write + audit into analytics__audit_*, publish atomically"
        run: uv run --frozen lakehouse wap

      - name: "3. Snapshot production"
        run: uv run --frozen lakehouse snapshot --out prod-before.json

      - name: "4. Ingest a broken late delivery (unknown zone, payment type and vendor)"
        env:
          LAKEHOUSE_INJECT_BAD_RECORDS: "1"
        run: uv run --frozen lakehouse ingest

      - name: "5. WAP must fail the audit and refuse to publish"
        run: |
          set +e
          uv run --frozen lakehouse wap
          rc=$?
          set -e
          if [ "$rc" -ne 2 ]; then
            echo "::error::expected exit code 2 (audit failed), got $rc"
            exit 1
          fi
          echo "Audit failed as expected (exit 2): publish was refused."

      - name: "6. Production is byte-for-byte untouched (same publish id, same row counts)"
        run: uv run --frozen lakehouse verify-unchanged prod-before.json

      - name: "7. Recover: good delivery publishes again, previous version kept for rollback"
        run: |
          uv run --frozen lakehouse ingest
          uv run --frozen lakehouse wap
          uv run --frozen lakehouse rollback
          uv run --frozen lakehouse snapshot --out prod-after-rollback.json

      - name: Production manifest for slim CI (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: transform
        env:
          DBT_TARGET: postgres
          DBT_SCHEMA: analytics
        run: |
          uv run --frozen dbt parse --target-path target/prod-state
          mkdir -p "$GITHUB_WORKSPACE/prod-state"
          cp target/prod-state/manifest.json "$GITHUB_WORKSPACE/prod-state/manifest.json"
          echo "$GITHUB_SHA" > "$GITHUB_WORKSPACE/prod-state/prod_sha.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: prod-manifest
          path: prod-state/
          retention-days: 90

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: wap-evidence
          path: |
            prod-before.json
            prod-after-rollback.json
            transform/target/wap-audit/run_results.json
          retention-days: 14

  pr-environment:
    name: PR environment (slim CI + ephemeral schema)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # download the production manifest artifact from main
      pull-requests: write # sticky summary comment
    services:
      postgres:
        image: postgres:16.14-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: lakehouse
          POSTGRES_PASSWORD: ci-throwaway-password # not a secret: ephemeral CI container
          POSTGRES_DB: lakehouse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lakehouse -d lakehouse"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      LAKEHOUSE_TARGET: postgres
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: lakehouse
      PGPASSWORD: ci-throwaway-password
      PGDATABASE: lakehouse
      PGSSLMODE: disable
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-lakehouse

      - name: Download the production manifest of the last green main run
        id: state
        run: |
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
            --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -n "$run_id" ] && gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
               --name prod-manifest --dir prod-state; then
            echo "mode=slim" >> "$GITHUB_OUTPUT"
            echo "prod_sha=$(cat prod-state/prod_sha.txt)" >> "$GITHUB_OUTPUT"
            echo "Using production manifest from run $run_id (main@$(cat prod-state/prod_sha.txt))"
          else
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "::notice::No production manifest found, falling back to a full build."
          fi

      - name: Ingest raw data into the ephemeral warehouse
        run: uv run --frozen lakehouse ingest

      - name: Hydrate a production replica from main (the state we defer to)
        if: steps.state.outputs.mode == 'slim'
        env:
          PROD_SHA: ${{ steps.state.outputs.prod_sha }}
        run: |
          git worktree add "$RUNNER_TEMP/prod" "$PROD_SHA"
          cd "$RUNNER_TEMP/prod"
          uv sync --frozen
          (cd transform && uv run --frozen dbt deps)
          uv run --frozen lakehouse wap

      - name: Build the PR into pr_${{ env.PR_NUMBER }}_* (slim or full)
        id: build
        env:
          MODE: ${{ steps.state.outputs.mode }}
        run: |
          set +e
          if [ "$MODE" = "slim" ]; then
            uv run --frozen lakehouse build --schema "pr_${PR_NUMBER}" -- \
              --select state:modified+ --defer --state "$GITHUB_WORKSPACE/prod-state"
          else
            uv run --frozen lakehouse build --schema "pr_${PR_NUMBER}"
          fi
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      - name: Ingestion contract status
        id: contract
        run: |
          if uv run --frozen datacontract test --server fixture contracts/tlc_green_trips.odcs.yaml \
             && uv run --frozen datacontract test --server fixture contracts/tlc_taxi_zones.odcs.yaml; then
            echo "status=PASSED (2 ODCS contracts)" >> "$GITHUB_OUTPUT"
          else
            echo "status=FAILED" >> "$GITHUB_OUTPUT"
          fi

      - name: Render PR summary
        env:
          MODE: ${{ steps.state.outputs.mode }}
          CONTRACT_STATUS: ${{ steps.contract.outputs.status }}
        run: |
          uv run --frozen lakehouse pr-summary --schema "pr_${PR_NUMBER}" --mode "$MODE" \
            --contract-status "$CONTRACT_STATUS" --out pr-summary.md
          cat pr-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post or update the sticky PR comment
        # Fork PRs get a read-only token; the job summary above still has the report.
        continue-on-error: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          comment_id="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- lakehouse-pr-summary -->")) | .id' | head -n 1)"
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -F body=@pr-summary.md > /dev/null
          else
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file pr-summary.md
          fi

      - name: Fail the job if the PR build or contracts failed
        env:
          BUILD_RC: ${{ steps.build.outputs.rc }}
          CONTRACT_STATUS: ${{ steps.contract.outputs.status }}
        run: |
          if [ "$BUILD_RC" != "0" ] || [ "${CONTRACT_STATUS#PASSED}" = "$CONTRACT_STATUS" ]; then
            echo "::error::PR build (rc=$BUILD_RC) or ingestion contracts ($CONTRACT_STATUS) failed"
            exit 1
          fi

  terraform:
    name: terraform (fmt, validate, test with mocks, checkov)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - name: terraform test (mock_provider azurerm, no Azure account)
        run: terraform test
      - name: Install uv for checkov
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.13.0"
      - name: checkov (soft fail, findings in the job log)
        working-directory: .
        run: >-
          uvx --python 3.12 checkov@3.3.26 --directory infra/terraform --framework terraform
          --directory . --framework dockerfile --framework github_actions
          --quiet --compact --soft-fail

  container:
    name: container (build, Trivy, push + cosign on main)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to GHCR (main only)
      id-token: write # cosign keyless signing (main only)
      security-events: write # upload Trivy SARIF
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      TRIVY_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-db:2
      TRIVY_JAVA_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-java-db:1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=main,enable={{is_default_branch}}

      - name: Build image (local, for scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: lakehouse:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image (non-root, CLI starts)
        run: |
          test "$(docker run --rm --entrypoint id lakehouse:ci -u)" = "10001"
          docker run --rm lakehouse:ci --help

      - name: Trivy scan (SARIF for code scanning)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: lakehouse:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: always() && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      - name: Trivy gate (fail on fixable CRITICAL vulnerabilities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: lakehouse:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push image
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.PUBLISH == 'true'

      - name: Sign the image (cosign keyless, GitHub OIDC)
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          {
            echo "### Published image"
            echo ""
            echo "\`${IMAGE}@${DIGEST}\`"
            echo ""
            echo "Verify:"
            echo '```bash'
            echo "cosign verify ${IMAGE}@${DIGEST} \\"
            echo "  --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/heads/main$' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
