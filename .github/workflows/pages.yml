name: pages

# Live documentation: dbt docs (lineage graph, column docs, tests) and the data
# quality report, rebuilt from main on every merge and published to GitHub Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  DBT_PROFILES_DIR: ${{ github.workspace }}/transform
  LAKEHOUSE_DUCKDB_PATH: ${{ github.workspace }}/.lake/warehouse.duckdb
  DO_NOT_TRACK: "1"
  DBT_SEND_ANONYMOUS_USAGE_STATS: "false"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lakehouse

      - name: Build the lakehouse on DuckDB
        run: |
          uv run --frozen lakehouse ingest
          uv run --frozen lakehouse build

      - name: dbt docs (static single page with lineage)
        working-directory: transform
        run: uv run --frozen dbt docs generate --static

      - name: Assemble site
        run: |
          mkdir -p _site/docs
          cp site/index.html _site/index.html
          cp transform/target/static_index.html _site/docs/index.html
          cp transform/target/manifest.json transform/target/catalog.json _site/docs/
          uv run --frozen lakehouse report --out _site/quality
          touch _site/.nojekyll

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
