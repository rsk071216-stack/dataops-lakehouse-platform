# Dependency updates with a cooldown: a release must be at least 14 days old
# before Dependabot proposes it (supply-chain hygiene; most bad releases are
# yanked within days). Minor and patch updates are grouped to keep noise low.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
      semver-major-days: 30
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"

  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    ignore:
      # Provider majors (azurerm 5.x) change resource schemas; upgrade deliberately.
      - dependency-name: hashicorp/azurerm
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "infra"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    ignore:
      # The base image must match requires-python (3.12) in pyproject.toml and
      # uv.lock; a Python minor upgrade is a reviewed change, not a bump.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: "image"
