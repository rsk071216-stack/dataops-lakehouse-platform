extends: default

ignore: |
  .venv/
  .lake/
  transform/dbt_packages/
  transform/target/
  infra/terraform/.terraform/

rules:
  line-length:
    max: 160
    level: warning
    # dbt unit test fixtures are clearer as one row per line.
    ignore: |
      transform/models/
  document-start: disable
  truthy:
    allowed-values: ["true", "false"]
    check-keys: false
  comments:
    min-spaces-from-content: 1
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1
  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 1
